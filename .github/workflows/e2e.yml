name: E2E (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://onboarding:onboarding@localhost:5432/onboarding
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-e2e-secret-ci-e2e-secret-ci-e2e-0123456
      MAIL_TRANSPORT: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
